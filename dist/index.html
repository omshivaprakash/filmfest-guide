<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Explore film festivals, films, credits and awards across Bengaluru, Goa and Kerala.">
<title>FilmFest Guide</title>
<link rel="stylesheet" href="style.css">
<script defer src="app.js"></script>
</head>
<body>
<header class="top"><div class="wrap bar"><a class="brand" href="#films">◉ FilmFest Guide</a><nav aria-label="Main navigation"><a href="#festivals">Festivals</a><a href="#films">Films</a><a href="#people">People</a><a href="#awards">Awards</a></nav></div></header>
<main>
<section class="wrap archive" id="archive">
<div class="heading"><div><p class="eyebrow">Bengaluru · Goa · Kerala</p><h1 id="archive-title">Films</h1></div><span class="edition-note" id="edition-note">Archive coverage varies by edition</span></div>
<div class="controls">
<label>Search <input type="search" id="search" placeholder="Search titles, names, awards…" autocomplete="off"></label>
<label>Festival <select id="festival"><option value="">All festivals</option></select></label>
<label>Edition <select id="edition"><option value="">All editions</option></select></label>
<label id="facet-label"><span id="facet-caption">Format</span><select id="facet"></select></label>
</div>
<div class="results-bar"><p id="count" aria-live="polite"></p><button type="button" id="reset">Clear filters</button></div>
<div id="results" class="results"></div>
<div class="pagination" role="group" aria-label="Results pages">
<button type="button" id="previous">Previous</button>
<span id="page-status" aria-live="polite"></span>
<button type="button" id="next">Next</button>
</div>
</section>
</main>
<dialog id="detail" aria-labelledby="detail-title"><form method="dialog"><button class="close" aria-label="Close details">×</button></form><div id="detail-content"></div></dialog>
</body>
</html>
